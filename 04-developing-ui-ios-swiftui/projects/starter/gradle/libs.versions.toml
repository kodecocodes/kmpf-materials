[versions]
agp = "8.8.0"
kotlin = "2.1.20"
compose-material3 = "1.3.1"
androidx-activityCompose = "1.10.0"
android-compileSdk = "35"
android-minSdk = "26"
android-targetSdk = "34"
compose-bom = "2025.01.00"
kotlinxDateTime = "0.6.1"
napier = "2.6.1"
material-iconsExtended = "1.7.6"
jetbrains-compose = "1.7.3"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }

# Compose
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activityCompose" }
compose-ui = { module = "androidx.compose.ui:ui"}
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling"}
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview"}
compose-foundation = { module = "androidx.compose.foundation:foundation"}
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "compose-material3" }
material-iconsExtended = { module = "androidx.compose.material:material-icons-extended", version.ref = "material-iconsExtended" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "compose-bom" }

# DateTime
datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref ="kotlinxDateTime"}

#Napier
napier = { module = "io.github.aakira:napier", version.ref ="napier" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
jetbrains-compose = { id = "org.jetbrains.compose", version.ref = "jetbrains-compose" }


[bundles]
compose-ui = ["compose-material3", "material-iconsExtended", "androidx-activity-compose", "compose-foundation",  "compose-ui", "compose-ui-tooling", "compose-ui-tooling-preview"]