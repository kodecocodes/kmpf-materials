[versions]
gradle = "8.8.0"
android-sdk-compile = "35"
android-sdk-min = "24"
android-sdk-target = "35"
android-material = "1.12.0"
androidx-compose-bom = "2025.01.01"
androidx-lifecycle-runtime-ktx = "2.8.7"
androidx-navigation-compose = "2.8.6"
coil = "2.7.0"
image-loader = "1.10.0"
korio = "4.0.10"
kotlin = "2.1.20"
kotlinx-datetime = "0.6.1"
jetbrains-compose = "1.7.3"
jetbrains-compose-lifecycle = "2.8.0"
okio = "3.10.2"
sqldelight = "2.0.2"
kotlin-stdlib = "2.1.20"
kotlin-test = "2.1.20"
runner = "1.5.2"
core = "1.5.0"
junit = "1.1.5"

[libraries]
android-material = { module = "com.google.android.material:material", version.ref = "android-material" }

androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "androidx-compose-bom" }
